<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="pageTitle">CelestAI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📐</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">◳</span>
    <h1>CelestAI</h1>
  </div>
  <div class="topbar-right">
    <div class="lang-switch" id="langSwitch" role="group" aria-label="Language">
      <button class="lang active" data-lang="ar" lang="ar">عربي</button>
      <button class="lang" data-lang="en" lang="en">EN</button>
    </div>
    <button type="button" class="ai-badge" id="aiBadge"
            data-i18n-title="aiSettingsTitle" aria-haspopup="dialog">…</button>
  </div>
</header>

<main>
  <!-- ============ لوحة المدخلات ============ -->
  <aside class="panel" id="form">
    <div class="mode-switch" id="modeSwitch" role="group">
      <button class="mode active" data-mode="unit" data-i18n="modeUnit"></button>
      <button class="mode" data-mode="building" data-i18n="modeBuilding"></button>
    </div>

    <section class="step" id="typeStep">
      <h2><span class="num">1</span> <span data-i18n="stepType"></span></h2>
      <div class="chips" id="buildingTypes"></div>
    </section>

    <section class="step">
      <h2><span class="num">2</span> <span data-i18n="stepArea"></span></h2>
      <label class="field">
        <span data-i18n="totalArea"></span>
        <input type="number" id="area" value="120" min="16" max="5000" step="1">
      </label>
      <div class="row">
        <label class="field">
          <span data-i18n="width"></span>
          <input type="number" id="width" data-i18n-ph="auto" min="3" step="0.1">
        </label>
        <label class="field">
          <span data-i18n="depth"></span>
          <input type="number" id="depth" data-i18n-ph="auto" min="3" step="0.1">
        </label>
      </div>
      <p class="hint" data-i18n="dimsHint"></p>
    </section>

    <section class="step" id="floorsStep" hidden>
      <h2><span class="num">3</span> <span data-i18n="stepFloors"></span></h2>
      <label class="field">
        <span data-i18n="floorCount"></span>
        <input type="number" id="floorCount" value="5" min="1" max="40">
      </label>
      <p class="hint" data-i18n="floorsHint"></p>
      <div class="floor-rules" id="floorRules"></div>
      <button type="button" class="add-rule" id="addRule" data-i18n="addRule"></button>
    </section>

    <section class="step" id="roomsStep">
      <h2><span class="num">3</span> <span data-i18n="stepProgram"></span></h2>
      <div class="row" id="roomCounts">
        <label class="field">
          <span data-i18n="bedrooms"></span>
          <input type="number" id="bedrooms" data-i18n-ph="auto" min="0" max="8">
        </label>
        <label class="field">
          <span data-i18n="bathrooms"></span>
          <input type="number" id="bathrooms" data-i18n-ph="auto" min="0" max="6">
        </label>
        <label class="field">
          <span data-i18n="receptions"></span>
          <input type="number" id="receptions" data-i18n-ph="auto" min="0" max="3">
        </label>
      </div>
      <label class="field">
        <span data-i18n="entrySide"></span>
        <select id="entrySide">
          <option value="auto" data-i18n="sideAuto"></option>
          <option value="north" data-i18n="sideNorth"></option>
          <option value="south" data-i18n="sideSouth"></option>
          <option value="east" data-i18n="sideEast"></option>
          <option value="west" data-i18n="sideWest"></option>
        </select>
      </label>
      <label class="field">
        <span data-i18n="briefLabel"></span>
        <div class="brief-wrap">
          <textarea id="brief" rows="3" data-i18n-ph="briefPlaceholder"></textarea>
          <!-- ب-3 · الوصف بالصوت -->
          <button type="button" class="mic" id="micBtn" hidden
                  data-i18n-title="voiceBrief" aria-label="voice">🎙</button>
        </div>
        <span class="hint" id="micHint" hidden></span>
      </label>

      <!-- ب-1/ب-2 · المداخل البصرية -->
      <div class="vision-row" id="visionRow" hidden>
        <button type="button" class="ghost" id="sketchBtn" data-i18n="fromSketch"></button>
        <button type="button" class="ghost" id="siteBtn" data-i18n="fromSite"></button>
        <input type="file" id="visionFile" accept="image/png,image/jpeg,image/webp" hidden>
      </div>
    </section>

    <!-- ============ مزايا الذكاء الاصطناعي ============ -->
    <section class="step" id="aiStep">
      <h2><span class="num">4</span> <span data-i18n="stepAi"></span></h2>

      <label class="toggle" data-feature="repair">
        <input type="checkbox" id="optRepair">
        <span data-i18n="optRepair"></span>
        <small data-i18n="optRepairHint"></small>
      </label>
      <label class="toggle" data-feature="explain">
        <input type="checkbox" id="optExplain">
        <span data-i18n="optExplain"></span>
        <small data-i18n="optExplainHint"></small>
      </label>
      <label class="toggle" data-feature="options">
        <input type="checkbox" id="optIntent">
        <span data-i18n="optIntent"></span>
        <small data-i18n="optIntentHint"></small>
      </label>

      <label class="toggle" data-feature="boq">
        <input type="checkbox" id="optBoq">
        <span data-i18n="optBoq"></span>
        <small data-i18n="optBoqHint"></small>
      </label>
      <label class="toggle" data-feature="solar">
        <input type="checkbox" id="optSolar">
        <span data-i18n="optSolar"></span>
        <small data-i18n="optSolarHint"></small>
      </label>
      <label class="field sub" id="cityField" hidden>
        <span data-i18n="cityLabel"></span>
        <select id="solarCity"></select>
      </label>

      <label class="toggle" data-feature="furnish">
        <input type="checkbox" id="optFurnish">
        <span data-i18n="optFurnish"></span>
        <small data-i18n="optFurnishHint"></small>
      </label>
      <label class="toggle" data-feature="finishes">
        <input type="checkbox" id="optFinishes">
        <span data-i18n="optFinishes"></span>
        <small data-i18n="optFinishesHint"></small>
      </label>
      <label class="field sub" id="tierField" hidden>
        <span data-i18n="tierLabel"></span>
        <select id="finishTier">
          <option value="economy" data-i18n="tierEconomy"></option>
          <option value="standard" selected data-i18n="tierStandard"></option>
          <option value="premium" data-i18n="tierPremium"></option>
        </select>
      </label>
    </section>

    <section class="step">
      <h2><span class="num">5</span> <span data-i18n="stepOutputs"></span></h2>
      <div class="outputs">
        <label><input type="checkbox" value="svg" checked disabled> <span data-i18n="outSvg"></span></label>
        <label><input type="checkbox" value="report" checked> <span data-i18n="outReport"></span></label>
        <label><input type="checkbox" value="pdf" checked> <span data-i18n="outPdf"></span></label>
        <label><input type="checkbox" value="dxf"> <span data-i18n="outDxf"></span></label>
        <label><input type="checkbox" value="json3d" checked> <span data-i18n="out3d"></span></label>
      </div>
      <label class="toggle">
        <input type="checkbox" id="useAi" checked>
        <span data-i18n="useAi"></span>
      </label>
    </section>

    <button id="run" class="run" data-i18n="generate"></button>
    <p class="err" id="error" hidden></p>
  </aside>

  <!-- ============ لوحة النتيجة ============ -->
  <section class="result">
    <div class="tabs">
      <button class="tab active" data-tab="plan" data-i18n="tabPlan"></button>
      <button class="tab" data-tab="alts" data-i18n="tabAlts"></button>
      <button class="tab" data-tab="three" data-i18n="tab3d"></button>
      <button class="tab" data-tab="report" data-i18n="tabReport"></button>
      <button class="tab" data-tab="checks" data-i18n="tabChecks"></button>
      <button class="tab" data-tab="chat" data-i18n="tabChat" hidden></button>
      <button class="tab" data-tab="cost" data-i18n="tabCost" hidden></button>
      <button class="tab" data-tab="solar" data-i18n="tabSolar" hidden></button>
      <button class="tab" data-tab="log" data-i18n="tabLog" hidden></button>
    </div>

    <div class="floor-nav" id="floorNav" hidden></div>
    <div class="stats" id="stats" hidden></div>

    <div class="views">
      <div class="view active" id="view-plan">
        <div class="placeholder" id="placeholder">
          <div class="ph-icon">◳</div>
          <h3 data-i18n="phTitle"></h3>
          <p data-i18n="phBody"></p>
        </div>
        <div class="zoom-wrap" id="zoomWrap">
          <div class="zoom-toolbar" role="group" aria-label="Zoom">
            <button type="button" class="zoom-btn" data-zoom="in" data-i18n-title="zoomIn">+</button>
            <span class="zoom-pct" id="zoomPct">100%</span>
            <button type="button" class="zoom-btn" data-zoom="out" data-i18n-title="zoomOut">−</button>
            <button type="button" class="zoom-btn zoom-fit" data-zoom="fit" data-i18n-title="zoomFit">⤢</button>
          </div>
          <div class="zoom-viewport" id="zoomViewport">
            <div id="svgHost" class="zoom-content"></div>
          </div>
        </div>
      </div>

      <div class="view" id="view-alts"><div id="altHost" class="alt-host"></div></div>
      <div class="view" id="view-three"><div id="threeHost" class="three-host"></div></div>
      <div class="view" id="view-report"><article id="reportHost" class="report"></article></div>
      <div class="view" id="view-checks"><div id="checksHost" class="checks"></div></div>

      <!-- أ-2 · الحوار التصميمي -->
      <div class="view" id="view-chat">
        <div class="chat">
          <div class="chat-log" id="chatLog"></div>
          <div class="chat-bar">
            <button type="button" class="chat-undo" id="chatUndo"
                    data-i18n-title="undo" disabled>↶</button>
            <button type="button" class="chat-undo" id="chatRedo"
                    data-i18n-title="redo" disabled>↷</button>
            <input type="text" id="chatInput" data-i18n-ph="chatPlaceholder">
            <button type="button" class="chat-send" id="chatSend"
                    data-i18n="send"></button>
          </div>
          <p class="chat-hint" data-i18n="chatHint"></p>
        </div>
      </div>

      <div class="view" id="view-cost"><div id="costHost" class="report"></div></div>
      <div class="view" id="view-solar"><div id="solarHost" class="report"></div></div>
      <div class="view" id="view-log"><div id="logHost" class="rationale"></div></div>
    </div>

    <div class="downloads" id="downloads" hidden></div>
  </section>
</main>

<footer class="signature">
  <span>Made with</span>
  <span class="heart" aria-label="love">❤️</span>
  <span>by</span>
  <strong>Mohamed ELRady</strong>
</footer>

<!-- ب-1/ب-2 · تأكيد قراءة الصورة — مفيش ثقة صامتة في الرؤية -->
<div class="modal" id="visionModal" hidden>
  <div class="modal-box">
    <h3 id="visionTitle"></h3>
    <p class="modal-warn" data-i18n="visionWarn"></p>
    <div id="visionBody" class="vision-body"></div>
    <div class="modal-actions">
      <button type="button" class="ghost" id="visionCancel" data-i18n="cancel"></button>
      <button type="button" class="run" id="visionApply" data-i18n="applyReading"></button>
    </div>
  </div>
</div>

<!-- إعداد مزوّد الـ AI من الواجهة — المفتاح لا يُعاد للمتصفح بعد حفظه -->
<div class="modal" id="aiSettingsModal" role="dialog" aria-modal="true"
     aria-labelledby="aiSettingsHeading" hidden>
  <form class="modal-box ai-settings-box" id="aiSettingsForm">
    <div class="modal-heading">
      <div>
        <span class="eyebrow" data-i18n="aiSettingsEyebrow"></span>
        <h3 id="aiSettingsHeading" data-i18n="aiSettingsTitle"></h3>
      </div>
      <button type="button" class="modal-close" id="aiSettingsClose"
              data-i18n-title="cancel" aria-label="close">×</button>
    </div>

    <label class="field">
      <span data-i18n="providerLabel"></span>
      <select id="aiProviderSelect"></select>
    </label>
    <div class="provider-summary" id="providerSummary"></div>
    <div class="savings-summary">
      <div class="savings-summary-head">
        <span>◈</span>
        <strong data-i18n="smartSavingsTitle"></strong>
      </div>
      <span data-i18n="smartSavingsBody"></span>
      <span class="savings-stats" id="aiSavingsStats"></span>
    </div>

    <label class="field" id="apiKeyField">
      <span data-i18n="apiKeyLabel"></span>
      <div class="secret-input">
        <input type="text" class="masked-secret" id="aiApiKey"
               name="celestai-provider-token" autocomplete="off" data-1p-ignore
               data-lpignore="true" data-form-type="other" spellcheck="false"
               data-i18n-ph="apiKeyPlaceholder">
        <button type="button" id="toggleApiKey" data-i18n-title="showKey">◉</button>
      </div>
      <span class="hint" id="apiKeyHint"></span>
    </label>

    <label class="field">
      <span data-i18n="modelLabel"></span>
      <input type="text" id="aiModel" list="aiModelOptions" autocomplete="off"
             spellcheck="false" data-i18n-ph="modelPlaceholder">
      <datalist id="aiModelOptions"></datalist>
    </label>

    <label class="field" id="baseUrlField">
      <span data-i18n="baseUrlLabel"></span>
      <input type="url" id="aiBaseUrl" dir="ltr" spellcheck="false">
    </label>

    <div class="ai-settings-options">
      <label class="toggle compact">
        <input type="checkbox" id="aiVision">
        <span data-i18n="visionSupport"></span>
      </label>
      <label class="toggle compact">
        <input type="checkbox" id="rememberApiKey">
        <span data-i18n="rememberKey"></span>
      </label>
    </div>

    <p class="security-note"><span>⌁</span> <span data-i18n="keySecurity"></span></p>
    <div class="connection-status" id="aiConnectionStatus" aria-live="polite" hidden></div>

    <div class="provider-links">
      <a id="providerKeyLink" href="#" target="_blank" rel="noopener"
         data-i18n="getApiKey"></a>
      <a id="providerDocsLink" href="#" target="_blank" rel="noopener"
         data-i18n="providerDocs"></a>
    </div>

    <div class="modal-actions ai-settings-actions">
      <button type="button" class="danger-ghost" id="disconnectAi"
              data-i18n="disconnectAi"></button>
      <span class="action-spacer"></span>
      <button type="button" class="ghost" id="testAiConnection"
              data-i18n="testConnection"></button>
      <button type="button" class="ghost" id="aiSettingsCancel"
              data-i18n="cancel"></button>
      <button type="submit" class="run" id="saveAiSettings"
              data-i18n="saveSettings"></button>
    </div>
  </form>
</div>

<div class="loading" id="loading" hidden>
  <div class="spinner"></div>
  <p id="loadingText"></p>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
               "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/" } }
</script>
<script type="module" src="/static/app.js"></script>
</body>
</html>
